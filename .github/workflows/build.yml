name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: unzip -q NeonCity_Game.zip -d proj
      - run: |
          cd proj/NeonCity/android
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCity-APK
          path: proj/NeonCity/android/app/build/outputs/apk/debug/app-debug.apk
